spring.application.name=PriceWatch

# ----------------------------
# JPA & Hibernate Configuration
# ----------------------------

# Prevents Hibernate from creating or modifying the database schema.
# Validates that the schema matches the entity mappings.
# Recommended when Flyway fully manages schema changes.
spring.jpa.hibernate.ddl-auto=validate

# Logs all SQL statements executed by Hibernate.
# Useful for debugging and development visibility.
spring.jpa.show-sql=true

# Specifies the SQL dialect Hibernate should use.
# Ensures compatibility with PostgreSQL-specific SQL syntax.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Formats SQL queries in logs for better readability.
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------
# Flyway Configuration
# ----------------------------

# Enables Flyway database migrations at application startup.
# Explicit for clarity, even though the Flyway starter enables it by default.
spring.flyway.enabled=true
spring.flyway.locations=filesystem:db/migration
spring.flyway.schemas=[SCHEMA]

spring.datasource.url=[DB_URL]
spring.datasource.username=[DB_USERNAME]
spring.datasource.password=[DB_PASSWORD]

#jwt
jwt.secret=${JWT_SECRET:dev-only-change-me-min-32-chars!!}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
